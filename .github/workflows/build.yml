name: Build Windows exe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller yt-dlp

      - name: Build exe with PyInstaller
        run: |
          python -m PyInstaller --onefile --windowed --collect-all yt_dlp --icon icon.ico --name MBPs_Video_Downloader downloader.pyw

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MBPs-Video-Downloader-windows
          path: dist/MBPs_Video_Downloader.exe


